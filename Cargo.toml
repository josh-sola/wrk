[package]
name = "wrk"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.189"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
