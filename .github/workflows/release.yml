# On each push to main, release the version in Cargo.toml if it has no release yet.
# To ship, bump `version` in Cargo.toml. Other pushes skip the build.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released, skipping"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.new == 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.new == 'true'

      - name: Check
        if: steps.version.outputs.new == 'true'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build a universal binary
        if: steps.version.outputs.new == 'true'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/wrk \
            target/aarch64-apple-darwin/release/wrk \
            target/x86_64-apple-darwin/release/wrk
          tar -czf wrk-macos.tar.gz -C dist wrk
          shasum -a 256 wrk-macos.tar.gz > wrk-macos.tar.gz.sha256

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes \
            wrk-macos.tar.gz wrk-macos.tar.gz.sha256
