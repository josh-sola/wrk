id = "dev.wrk"
name = "wrk"
version = "0.1.0"
description = "Pick a wrk worktree and open its harness in a herdr workspace."
min_herdr_version = "0.9.0"
platforms = ["macos"]

[[panes]]
id = "pick"
title = "wrk"
placement = "popup"
width = "90%"
height = "80%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/open.sh\""]

[[actions]]
id = "pick"
title = "Pick a worktree"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "dev.wrk", "--entrypoint", "pick"]
